[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-context-aware"
version = "0.1.0"
description = "Adaptive context-aware perception system baseline implementation."
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.10.0",
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "protobuf>=5.27.0",
    "pydantic>=2.7.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.1",
    "pyzmq>=26.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "jsonschema>=4.22.0",
    "pytest>=8.2.0",
]
test = [
    "httpx>=0.28.0",
    "jsonschema>=4.22.0",
    "pytest>=8.2.0",
    "opencv-python-headless>=4.10.0",
    "torch>=2.4.0",
]
engine = [
    # TensorRT / torch-tensorrt / CUDA Python bindings are provided by the Jetson runtime image.
    "ultralytics>=8.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
