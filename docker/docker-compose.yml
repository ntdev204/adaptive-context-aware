services:
  control-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    environment:
      CTX_CAMERA_BACKEND: openni
      CTX_ASTRAS_DEPTH_DEVICE: ""
      CTX_ASTRAS_RGB_DEVICE: ""
      CTX_RUNTIME_ROLE: control-api
      CTX_RUNTIME_BACKEND: engine
      CTX_JETSON_HOST: 25.12.4.100
      CTX_PI_HOST: 25.12.4.101
      CTX_SENSOR_INGEST_PORT: 5555
      CTX_RESULT_PUBLISH_PORT: 5556
      CTX_HEARTBEAT_PORT: 9093
      CTX_HEARTBEAT_INTERVAL_MS: 500
      CTX_PT_MODEL_PATH: /app/models/fine_tuning/best.pt
      CTX_ENGINE_MODEL_PATH: /app/models/engines/best.engine
      CTX_TRACKER_CONFIG_PATH: /app/models/fine_tuning/botsort_tuned.json
    volumes:
      - ../models:/app/models
      - ctx-aware-engines:/app/models/engines
    devices:
      - /dev/bus/usb:/dev/bus/usb
    network_mode: host
    privileged: true
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8080"]

  dev-control-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      CTX_CAMERA_BACKEND: openni
      CTX_ASTRAS_DEPTH_DEVICE: ""
      CTX_ASTRAS_RGB_DEVICE: ""
      CTX_RUNTIME_ROLE: dev-control-api
      CTX_RUNTIME_BACKEND: engine
      CTX_JETSON_HOST: 127.0.0.1
      CTX_PI_HOST: 127.0.0.2
      CTX_SENSOR_INGEST_PORT: 5555
      CTX_RESULT_PUBLISH_PORT: 5556
      CTX_HEARTBEAT_PORT: 9093
      CTX_HEARTBEAT_INTERVAL_MS: 500
      CTX_PT_MODEL_PATH: /app/models/fine_tuning/best.pt
      CTX_ENGINE_MODEL_PATH: /app/models/engines/best.engine
      CTX_TRACKER_CONFIG_PATH: /app/models/fine_tuning/botsort_tuned.json
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../scripts:/app/scripts
      - ../models:/app/models
    ports:
      - "8080:8080"
      - "5555:5555"
      - "5556:5556"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8080"]

  monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      CTX_RUNTIME_ROLE: monitor
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../scripts:/app/scripts
      - ../tests:/app/tests
    command: ["python", "scripts/benchmark.py", "--device", "ci", "--compare-baseline"]

  watchdog:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      CTX_RUNTIME_ROLE: watchdog
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../scripts:/app/scripts
    command: ["python", "-m", "src.main"]

  synthetic-h5:
    profiles: ["dataset"]
    image: ctx-aware:dev
    environment:
      CTX_RUNTIME_ROLE: synthetic-h5
      SYNTHETIC_RAW_DIR: ${SYNTHETIC_RAW_DIR:-data/raw}
      SYNTHETIC_OUTPUT_DIR: ${SYNTHETIC_OUTPUT_DIR:-data/synthetic}
      SYNTHETIC_MODEL_PATH: ${SYNTHETIC_MODEL_PATH:-models/fine_tuning/best.pt}
      SYNTHETIC_TRACKER_CONFIG: ${SYNTHETIC_TRACKER_CONFIG:-models/fine_tuning/botsort_tuned.json}
      SYNTHETIC_SOURCE_KIND: ${SYNTHETIC_SOURCE_KIND:-all}
      SYNTHETIC_IMAGE_DETECTION_SOURCE: ${SYNTHETIC_IMAGE_DETECTION_SOURCE:-hybrid}
      SYNTHETIC_EXTRA_ARGS: ${SYNTHETIC_EXTRA_ARGS:-}
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../pipelines:/app/pipelines
      - ../data:/app/data
      - ../models:/app/models
    command:
      - sh
      - -lc
      - >
        python -c "import PIL" 2>/dev/null || pip install --no-cache-dir pillow;
        python pipelines/generate_synthetic_h5.py
        --raw-dir "$${SYNTHETIC_RAW_DIR}"
        --output-dir "$${SYNTHETIC_OUTPUT_DIR}"
        --model-path "$${SYNTHETIC_MODEL_PATH}"
        --tracker-config "$${SYNTHETIC_TRACKER_CONFIG}"
        --source-kind "$${SYNTHETIC_SOURCE_KIND}"
        --image-detection-source "$${SYNTHETIC_IMAGE_DETECTION_SOURCE}"
        $${SYNTHETIC_EXTRA_ARGS}

volumes:
  ctx-aware-engines:
