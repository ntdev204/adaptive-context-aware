name: adaptive-context-aware

x-adaptive-env: &adaptive-env
  CTX_BIND_HOST: ${CTX_BIND_HOST:-0.0.0.0}
  CTX_LOG_LEVEL: ${CTX_LOG_LEVEL:-INFO}
  CTX_CAMERA_BACKEND: ${CTX_CAMERA_BACKEND:-openni}
  CTX_CAMERA_SOURCE: ${CTX_CAMERA_SOURCE:-device}
  CTX_ASTRAS_DEPTH_DEVICE: ${CTX_ASTRAS_DEPTH_DEVICE:-/dev/video1}
  CTX_ASTRAS_RGB_DEVICE: ${CTX_ASTRAS_RGB_DEVICE:-/dev/video0}
  CTX_RUNTIME_BACKEND: ${CTX_RUNTIME_BACKEND:-engine}
  CTX_REQUIRE_ENGINE_AT_BOOT: ${CTX_REQUIRE_ENGINE_AT_BOOT:-false}
  CTX_AUTOSTART: ${CTX_AUTOSTART:-true}
  CTX_JETSON_HOST: ${CTX_JETSON_HOST:-25.12.4.100}
  CTX_PI_HOST: ${CTX_PI_HOST:-25.12.4.101}
  CTX_SCADA_CAMERA_HOST: ${CTX_SCADA_CAMERA_HOST:-25.12.4.101}
  CTX_SCADA_CAMERA_PORT: ${CTX_SCADA_CAMERA_PORT:-5557}
  CTX_CAMERA_PUBLISH_PORT: ${CTX_CAMERA_PUBLISH_PORT:-5557}
  CTX_CAMERA_PUBLISH_ENABLED: ${CTX_CAMERA_PUBLISH_ENABLED:-true}
  CTX_CAMERA_FRAME_TIMEOUT_MS: ${CTX_CAMERA_FRAME_TIMEOUT_MS:-2000}
  CTX_SENSOR_INGEST_PORT: ${CTX_SENSOR_INGEST_PORT:-5555}
  CTX_RESULT_PUBLISH_PORT: ${CTX_RESULT_PUBLISH_PORT:-5556}
  CTX_HEARTBEAT_PORT: ${CTX_HEARTBEAT_PORT:-9093}
  CTX_HEARTBEAT_INTERVAL_MS: ${CTX_HEARTBEAT_INTERVAL_MS:-500}
  CTX_MAX_SENSOR_AGE_MS: ${CTX_MAX_SENSOR_AGE_MS:-1000}
  CTX_PERCEPTION_ENABLED: ${CTX_PERCEPTION_ENABLED:-true}
  CTX_PERCEPTION_INTERVAL_MS: ${CTX_PERCEPTION_INTERVAL_MS:-100}
  CTX_PT_MODEL_PATH: ${CTX_PT_MODEL_PATH:-/app/models/fine_tuning/best.pt}
  CTX_ENGINE_MODEL_PATH: ${CTX_ENGINE_MODEL_PATH:-/app/models/engines/best.engine}
  CTX_TRACKER_CONFIG_PATH: ${CTX_TRACKER_CONFIG_PATH:-/app/models/fine_tuning/botsort_tuned.json}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

services:
  jetson-prod:
    image: context-aware:jetson-prod
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      target: jetson-prod
    environment:
      <<: *adaptive-env
      CTX_RUNTIME_ROLE: jetson-prod
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
      CUDA_MODULE_LOADING: ${CUDA_MODULE_LOADING:-LAZY}
      PYTHONPATH: /app
    volumes:
      - ../models:/app/models
      - ../models/torch_cache:/data/models/torch
      - ../logs:/app/logs
      - ../data:/app/data
      - ../config:/app/config:ro
      - /run/udev:/run/udev:ro
    network_mode: host
    privileged: true
    runtime: nvidia
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 3g
    memswap_limit: 4g

  mlflow:
    image: context-aware:mlflow
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      target: mlflow
    profiles: ["mlops"]
    working_dir: /srv/mlflow
    environment:
      MLFLOW_BACKEND_URI: ${MLFLOW_BACKEND_URI:-sqlite:////srv/mlflow/state/mlflow.db}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-/srv/mlflow/artifacts}
      MLFLOW_HOST: ${MLFLOW_HOST:-0.0.0.0}
      MLFLOW_PORT: ${MLFLOW_PORT:-5000}
    volumes:
      - ../logs/mlflow:/srv/mlflow/state
      - ../logs/mlruns:/srv/mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command:
      - mlflow
      - server
      - --backend-store-uri
      - ${MLFLOW_BACKEND_URI:-sqlite:////srv/mlflow/state/mlflow.db}
      - --default-artifact-root
      - ${MLFLOW_ARTIFACT_ROOT:-/srv/mlflow/artifacts}
      - --host
      - ${MLFLOW_HOST:-0.0.0.0}
      - --port
      - ${MLFLOW_PORT:-5000}

  jetson-dev:
    profiles: ["jetson-dev"]
    image: context-aware:jetson-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      target: jetson-dev
    environment:
      <<: *adaptive-env
      CTX_RUNTIME_ROLE: jetson-dev
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
      CUDA_MODULE_LOADING: ${CUDA_MODULE_LOADING:-LAZY}
      PYTHONPATH: /app
    volumes:
      - ..:/app
      - /run/udev:/run/udev:ro
    network_mode: host
    privileged: true
    runtime: nvidia
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
    logging: *default-logging
    command: /bin/bash
    stdin_open: true
    tty: true
    restart: "no"

  monitor:
    profiles: ["ci"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      target: jetson-dev
    environment:
      CTX_RUNTIME_ROLE: monitor
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../scripts:/app/scripts
      - ../tests:/app/tests
    logging: *default-logging
    command: ["python", "scripts/benchmark.py", "--device", "ci", "--compare-baseline"]

  watchdog:
    profiles: ["debug"]
    image: context-aware:jetson-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      target: jetson-dev
    environment:
      <<: *adaptive-env
      CTX_RUNTIME_ROLE: watchdog
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../scripts:/app/scripts
      - ../logs:/app/logs
    logging: *default-logging
    command: ["python", "-m", "src.main"]

  synthetic-h5:
    profiles: ["dataset"]
    image: context-aware:jetson-dev
    environment:
      CTX_RUNTIME_ROLE: synthetic-h5
      SYNTHETIC_RAW_DIR: ${SYNTHETIC_RAW_DIR:-data/raw}
      SYNTHETIC_OUTPUT_DIR: ${SYNTHETIC_OUTPUT_DIR:-data/synthetic}
      SYNTHETIC_MODEL_PATH: ${SYNTHETIC_MODEL_PATH:-models/fine_tuning/best.pt}
      SYNTHETIC_TRACKER_CONFIG: ${SYNTHETIC_TRACKER_CONFIG:-models/fine_tuning/botsort_tuned.json}
      SYNTHETIC_SOURCE_KIND: ${SYNTHETIC_SOURCE_KIND:-all}
      SYNTHETIC_IMAGE_DETECTION_SOURCE: ${SYNTHETIC_IMAGE_DETECTION_SOURCE:-hybrid}
      SYNTHETIC_EXTRA_ARGS: ${SYNTHETIC_EXTRA_ARGS:-}
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../pipelines:/app/pipelines
      - ../data:/app/data
      - ../models:/app/models
      - ../logs:/app/logs
    logging: *default-logging
    command:
      - sh
      - -lc
      - >
        python -c "import PIL" 2>/dev/null || pip install --no-cache-dir pillow;
        python pipelines/generate_synthetic_h5.py
        --raw-dir "$${SYNTHETIC_RAW_DIR}"
        --output-dir "$${SYNTHETIC_OUTPUT_DIR}"
        --model-path "$${SYNTHETIC_MODEL_PATH}"
        --tracker-config "$${SYNTHETIC_TRACKER_CONFIG}"
        --source-kind "$${SYNTHETIC_SOURCE_KIND}"
        --image-detection-source "$${SYNTHETIC_IMAGE_DETECTION_SOURCE}"
        $${SYNTHETIC_EXTRA_ARGS}
