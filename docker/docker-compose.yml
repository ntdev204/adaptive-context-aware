name: adaptive-context-aware

x-adaptive-env: &adaptive-env
  CTX_BIND_HOST: ${CTX_BIND_HOST:-0.0.0.0}
  CTX_CAMERA_BACKEND: ${CTX_CAMERA_BACKEND:-openni}
  CTX_CAMERA_SOURCE: ${CTX_CAMERA_SOURCE:-device}
  CTX_ASTRAS_DEPTH_DEVICE: ${CTX_ASTRAS_DEPTH_DEVICE:-/dev/video1}
  CTX_ASTRAS_RGB_DEVICE: ${CTX_ASTRAS_RGB_DEVICE:-/dev/video0}
  CTX_RUNTIME_BACKEND: ${CTX_RUNTIME_BACKEND:-engine}
  CTX_AUTOSTART: ${CTX_AUTOSTART:-true}
  CTX_JETSON_HOST: ${CTX_JETSON_HOST:-25.12.4.100}
  CTX_PI_HOST: ${CTX_PI_HOST:-25.12.4.101}
  CTX_SCADA_CAMERA_HOST: ${CTX_SCADA_CAMERA_HOST:-${ZMQ_SCADA_HOST:-25.12.4.101}}
  CTX_SCADA_CAMERA_PORT: ${CTX_SCADA_CAMERA_PORT:-5557}
  CTX_CAMERA_PUBLISH_PORT: ${CTX_CAMERA_PUBLISH_PORT:-5557}
  CTX_CAMERA_PUBLISH_ENABLED: ${CTX_CAMERA_PUBLISH_ENABLED:-true}
  CTX_CAMERA_FRAME_TIMEOUT_MS: ${CTX_CAMERA_FRAME_TIMEOUT_MS:-2000}
  CTX_SENSOR_INGEST_PORT: ${CTX_SENSOR_INGEST_PORT:-5555}
  CTX_RESULT_PUBLISH_PORT: ${CTX_RESULT_PUBLISH_PORT:-5556}
  CTX_HEARTBEAT_PORT: ${CTX_HEARTBEAT_PORT:-9093}
  CTX_HEARTBEAT_INTERVAL_MS: ${CTX_HEARTBEAT_INTERVAL_MS:-500}
  CTX_PERCEPTION_ENABLED: ${CTX_PERCEPTION_ENABLED:-true}
  CTX_PERCEPTION_INTERVAL_MS: ${CTX_PERCEPTION_INTERVAL_MS:-100}
  CTX_PT_MODEL_PATH: ${CTX_PT_MODEL_PATH:-/app/models/fine_tuning/best.pt}
  CTX_ENGINE_MODEL_PATH: ${CTX_ENGINE_MODEL_PATH:-/app/models/engines/best.engine}
  CTX_TRACKER_CONFIG_PATH: ${CTX_TRACKER_CONFIG_PATH:-/app/models/fine_tuning/botsort_tuned.json}

x-rai-env: &rai-env
  POSTGRES_DB: ${POSTGRES_DB:-rai_website}
  POSTGRES_USER: ${POSTGRES_USER:-robot_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
  JWT_SECRET: ${JWT_SECRET:-supersecretkey_change_in_production}
  JWT_ACCESS_EXPIRE_MIN: ${JWT_ACCESS_EXPIRE_MIN:-1440}
  DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-admin}
  DEFAULT_ADMIN_PASS: ${DEFAULT_ADMIN_PASS:-admin123}
  ZMQ_SCADA_HOST: ${ZMQ_SCADA_HOST:-100.120.77.81}
  ZMQ_SCADA_HOSTS: ${ZMQ_SCADA_HOSTS:-100.120.77.81}
  ZMQ_CMD_PORT: ${ZMQ_CMD_PORT:-5555}
  ZMQ_TELEMETRY_PORT: ${ZMQ_TELEMETRY_PORT:-5556}
  ZMQ_CAMERA_PORT: ${ZMQ_CAMERA_PORT:-5557}
  ADAPTIVE_API_URL: ${ADAPTIVE_API_URL:-http://100.69.39.18:8080}
  ADAPTIVE_RESULT_HOST: ${ADAPTIVE_RESULT_HOST:-100.69.39.18}
  ADAPTIVE_RESULT_PORT: ${ADAPTIVE_RESULT_PORT:-5556}
  ADAPTIVE_RESULT_ENABLED: ${ADAPTIVE_RESULT_ENABLED:-true}
  TRAINING_API_URL: ${TRAINING_API_URL:-http://host.docker.internal:8081}
  ANALYTICS_COLLECT_INTERVAL_SEC: ${ANALYTICS_COLLECT_INTERVAL_SEC:-5}
  ANALYTICS_RETENTION_HOURS: ${ANALYTICS_RETENTION_HOURS:-168}
  WEBSITE_LOG_BUFFER_SIZE: ${WEBSITE_LOG_BUFFER_SIZE:-500}
  FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.78}
  FACE_AUTH_SHARED_SECRET: ${FACE_AUTH_SHARED_SECRET:-}
  FACE_DATA_DIR: /app/data/faces
  FACE_MIN_IMAGES: ${FACE_MIN_IMAGES:-8}
  FACE_MAX_IMAGES: ${FACE_MAX_IMAGES:-20}
  DATASET_DATA_DIR: /app/data/datasets
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-}
  OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.1}

services:
  control-api:
    image: ctx-aware:prod
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    environment:
      <<: *adaptive-env
      CTX_RUNTIME_ROLE: control-api
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
    volumes:
      - ../models:/app/models
      - ../logs:/app/logs
      - ../data:/app/data
      - ../config:/app/config:ro
    network_mode: host
    privileged: true
    runtime: nvidia
    devices:
      - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8080"]

  dev-control-api:
    profiles: ["dev"]
    image: ctx-aware:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      <<: *adaptive-env
      CTX_RUNTIME_ROLE: dev-control-api
      CTX_JETSON_HOST: ${CTX_JETSON_HOST:-127.0.0.1}
      CTX_PI_HOST: ${CTX_PI_HOST:-127.0.0.2}
      CTX_SCADA_CAMERA_HOST: ${CTX_SCADA_CAMERA_HOST:-127.0.0.2}
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../scripts:/app/scripts
      - ../models:/app/models
    ports:
      - "8080:8080"
      - "5555:5555"
      - "5556:5556"
    privileged: true
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8080"]

  rai-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rai_website}
      POSTGRES_USER: ${POSTGRES_USER:-robot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
    volumes:
      - rai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robot_admin} -d ${POSTGRES_DB:-rai_website}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rai-server:
    build:
      context: ../../rai_website/server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rai-postgres:
        condition: service_healthy
    environment:
      <<: *rai-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-robot_admin}:${POSTGRES_PASSWORD:-securepassword}@rai-postgres:5432/${POSTGRES_DB:-rai_website}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../rai_website/server:/app
      - ../../rai_website/server/data/faces:/app/data/faces
      - ../../rai_website/server/data/datasets:/app/data/datasets
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  rai-client:
    build:
      context: ../../rai_website/client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    restart: unless-stopped
    depends_on:
      - rai-server
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"

  monitor:
    profiles: ["ci"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      CTX_RUNTIME_ROLE: monitor
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../scripts:/app/scripts
      - ../tests:/app/tests
    command: ["python", "scripts/benchmark.py", "--device", "ci", "--compare-baseline"]

  watchdog:
    profiles: ["debug"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      CTX_RUNTIME_ROLE: watchdog
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../scripts:/app/scripts
    command: ["python", "-m", "src.main"]

  synthetic-h5:
    profiles: ["dataset"]
    image: ctx-aware:dev
    environment:
      CTX_RUNTIME_ROLE: synthetic-h5
      SYNTHETIC_RAW_DIR: ${SYNTHETIC_RAW_DIR:-data/raw}
      SYNTHETIC_OUTPUT_DIR: ${SYNTHETIC_OUTPUT_DIR:-data/synthetic}
      SYNTHETIC_MODEL_PATH: ${SYNTHETIC_MODEL_PATH:-models/fine_tuning/best.pt}
      SYNTHETIC_TRACKER_CONFIG: ${SYNTHETIC_TRACKER_CONFIG:-models/fine_tuning/botsort_tuned.json}
      SYNTHETIC_SOURCE_KIND: ${SYNTHETIC_SOURCE_KIND:-all}
      SYNTHETIC_IMAGE_DETECTION_SOURCE: ${SYNTHETIC_IMAGE_DETECTION_SOURCE:-hybrid}
      SYNTHETIC_EXTRA_ARGS: ${SYNTHETIC_EXTRA_ARGS:-}
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../pipelines:/app/pipelines
      - ../data:/app/data
      - ../models:/app/models
    command:
      - sh
      - -lc
      - >
        python -c "import PIL" 2>/dev/null || pip install --no-cache-dir pillow;
        python pipelines/generate_synthetic_h5.py
        --raw-dir "$${SYNTHETIC_RAW_DIR}"
        --output-dir "$${SYNTHETIC_OUTPUT_DIR}"
        --model-path "$${SYNTHETIC_MODEL_PATH}"
        --tracker-config "$${SYNTHETIC_TRACKER_CONFIG}"
        --source-kind "$${SYNTHETIC_SOURCE_KIND}"
        --image-detection-source "$${SYNTHETIC_IMAGE_DETECTION_SOURCE}"
        $${SYNTHETIC_EXTRA_ARGS}

volumes:
  rai-pgdata:
